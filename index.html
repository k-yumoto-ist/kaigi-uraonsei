</style></head><body><header><h1><span class="flag">24カテゴリ / 144ツッコミ</span>🎙️ 会議のウラ音声</h1><p>発言に合ったツッコミを選び、弾幕コンボを決めろ。架空の会議を実況する風刺ゲーム。</p></header><main><div class="topline"><div id="scenarios" class="scenarios"></div><div class="stats"><div>スコア <b id="score">0</b></div><div>COMBO <b id="combo">0</b></div><div>BEST <b id="best">0</b></div></div></div><div class="layout"><div><section class="panel"><div class="stage"><div class="scene-top"><span id="subTitle"></span><span id="round"></span></div><div class="meter"><div id="progress"></div></div><div class="danmaku-holder" id="danmaku"></div><div class="stage-center"><span class="avatar">● <span id="speaker"></span></span><h2 id="line"></h2><div class="backchannel"><div class="backchannel-label">🎧 ウラ音声 <small>脳内ツッコミ</small></div><p id="voiceContent" aria-live="polite"></p></div></div><div class="stage-footer"><div id="tag" class="tag"></div><button id="voiceToggle" type="button" aria-pressed="false">🔇 読み上げ OFF</button></div></div></section><section class="panel logpanel"><h3>🗒️ 会議ログ＆ツッコミ</h3><div id="log" class="logs"></div></section></div><section class="panel panel-body"><h3 id="question"></h3><div id="choices" class="choices"></div><div class="optionline"><label for="strength">皮肉の濃さ</label><select id="strength"><option value="1">やさしめ</option><option value="2" selected>ふつう</option><option value="3">辛口</option></select></div><div class="optionline"><input id="custom" aria-label="自由コメント" placeholder="自由コメントを書いて Enter で弾幕" maxlength="120"/><button id="sendCustom" type="button">弾幕を飛ばす</button></div><p class="caption">候補は現在の発言に紐付いた分類から抽出します。関係ないツッコミは候補に出しません。建設的な発言には称賛コメントも登場します。自由コメントは得点対象外です。</p></section></div><div id="toast" class="toast"></div><p class="caption">会議・人物はすべて架空です。実際の社内情報や録音は使いません。読み上げはブラウザの音声合成を使います。</p></main><script>const PATTERNS = [{"id":"abstract-1","tag":"abstract","text":"つまり、何を変える話？","flavor":1,"weight":4},{"id":"abstract-2","tag":"abstract","text":"抽象度、成層圏に到達。","flavor":2,"weight":4},{"id":"abst const TAG_LABELS = {"abstract":"抽象論","jargon":"横文字","ownership":"責任者不明","defer":"持ち帰り","deadline":"無茶な納期","scope":"スコープ増","repeat":"話のループ","no_decision":"結論なし","offtopic":"脱線","blame":"犯人探し","estimate":"根拠なき数字","ai_magic":"AI万能論","mic":"音声トラブル","silence":"沈黙","agree":"曖昧な同意","attendance":"参加者過多","prep":"準備不足","status":"曖昧な進捗","change":"方針変更","good":"建設的な決定","closing":"終了直前","goalpost":"要求変更","vague":"曖昧な要求","risk":"リスク軽視"};
const state={scenario:0,index:0,score:0,combo:0,best:0,history:[],seen:new Set(),used:[],strength:2,finished:false};
const $=(q)=>document.querySelector(q);
const rand=(n)=>Math.floor(Math.random()*n);
function goScenario(id){state.scenario=SCENARIOS.findIndex(s=>s.id===id);state.index=0;state.score=0;state.combo=0;state.best=0;state.history=[];state.seen.clear();state.used=[];state.finished=false;render();}
function relevant(p,t){return t.tags.includes(p.tag)}
function generateChoices(turn){
 const set=PATTERNS.filter(p=>relevant(p,turn)&&p.flavor<=state.strength+1);
 const fresh=set.filter(p=>!state.seen.has(p.id));
 const items=(fresh.length>=4?fresh:set).map(p=>({...p,rank:20+turn.tags.filter(tag=>tag===p.tag).length*20+p.weight+(state.used.includes(p.tag)?-5:0)+rand(9)}));
 // Choose context-fitting items while maximizing coverage across currently discussed tags.
 items.sort((a,b)=>b.rank-a.rank);
 const chosen=[],tags=new Set();
 for (let p of items){if(!tags.has(p.tag)){chosen.push(p);tags.add(p.tag);}if(chosen.length>=Math.min(2,turn.tags.length))break;}
 for (let p of items){if(chosen.length>=4)break;if(!chosen.find(c=>c.id===p.id))chosen.push(p);}
 return chosen.sort(()=>Math.random()-.5);
}

const BACKCHANNEL={

let voiceEnabled=false,lastSpoken="";
function voiceText(t){return BACKCHANNEL[t.tags[0]]||"この発言について考えよう。"}
function speakCurrent(t){
 if(!voiceEnabled||!("speechSynthesis" in window)||!t)return;
 const key=state.scenario+":"+state.index;
 if(lastSpoken===key)return;
 lastSpoken=key;window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(voiceText(t));u.lang="ja-JP";u.rate=1.03;u.pitch=.94;window.speechSynthesis.speak(u);
}
function submitCustom(){const input=$("#custom"),value=input.value.trim();if(!value)return;input.value="";flash(value,0);}
function render(){
 const s=SCENARIOS[state.scenario];
 $('#scenarios').innerHTML=SCENARIOS.map(x=>`<button class="scenario ${x.id===s.id?'on':''}" data-id="${x.id}">${x.title}</button>`).join('');
 $('#subTitle').textContent=s.subtitle;
 $('#score').textContent=state.score;
 $('#combo').textContent=state.combo;
 $('#best').textContent=state.best;
 $('#round').textContent=`${Math.min(state.index+1,s.turns.length)} / ${s.turns.length}`;
 $('#progress').style.width=(state.index/s.turns.length*100)+'%';
 $('#log').innerHTML=state.history.map(h=>`<div class="log"><span>${escapeHtml(h.speaker)}</span><p>${escapeHtml(h.line)}</p><div class="log-comment">${escapeHtml(h.comment)}</div></div>`).join('');
 $('#log').scrollTop=$('#log').scrollHeight;
 if(state.index>=s.turns.length){$('#voiceContent').textContent='会議が終わりました。みなさん、お疲れさまでした。';state.finished=true;$('#speaker').textContent='会議終了';$('#line').textContent='お疲れさまでした。結局、何か決まりましたか？';$('#question').textContent=`最終スコア ${state.score}点 / 最大コンボ ${state.best}`;$('#choices').innerHTML='<button class="again">もう一度この会議にツッコむ</button>';$('#progress').style.width='100%';return;}
 const t=s.turns[state.index];$('#speaker').textContent=t.speaker;$('#line').textContent=t.line;$('#question').textContent='この発言、どうツッコむ？';
 const choices=generateChoices(t);$('#choices').innerHTML=choices.map(p=>`<button class="choice" data-id="${p.id}"><span>💬</span>${escapeHtml(p.text)}</button>`).join('')+'<button class="choice observe" data-id="observe"><span>🤐</span>ここは静観</button>';
 $('#tag').textContent='状況: '+t.tags.map(t=>TAG_LABELS[t]).join('・');$('#voiceContent').textContent=voiceText(t);speakCurrent(t);
}
function pick(id){const s=SCENARIOS[state.scenario];const t=s.turns[state.index];if(!t||state.finished)return;
 const p=PATTERNS.find(v=>v.id===id);const isObserve=!p;let pts;
 if(isObserve){pts=t.tags.includes('good')?12:0;state.combo=0;}
 else {pts=(t.tags.includes(p.tag)?18:0)+(p.weight||0);if(p.tag==='good'&&t.tags.includes('good'))pts+=8;state.combo+=1;if(state.combo>=2)pts+=Math.min(20,(state.combo-1)*3);state.seen.add(p.id);state.used.unshift(p.tag);state.used=state.used.slice(0,4);}
 state.score+=pts;state.best=Math.max(state.best,state.combo);const txt=p?.text||'……ここは静かに見守ろう';
 state.history.push({...t,comment:txt});flash(txt,pts);state.index++;render();
}
function flash(str,pts){const node=document.createElement('div');node.className='danmaku';node.textContent=str;node.style.top=(18+rand(58))+'%';node.style.animationDuration=(5+rand(4))+'s';$('#danmaku').appendChild(node);setTimeout(()=>node.remove(),8500);$('#toast').textContent=`${pts?`+${pts} pt`:'静観'}  ${str}`;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2400);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
document.addEventListener('click',e=>{const scen=e.target.closest('.scenario');if(scen)goScenario(scen.dataset.id);const c=e.target.closest('.choice');if(c)pick(c.dataset.id);if(e.target.closest('.again'))goScenario(SCENARIOS[state.scenario].id);});
$('#strength').addEventListener('change',e=>{state.strength=Number(e.target.value);render()});
$("#custom").addEventListener("keydown",e=>{if(e.key==="Enter")submitCustom()});
$("#sendCustom").addEventListener("click",submitCustom);
$("#voiceToggle").addEventListener("click",()=>{
 if(!("speechSynthesis" in window)){ $("#voiceToggle").textContent="音声非対応";return; }
 voiceEnabled=!voiceEnabled;lastSpoken="";
 $("#voiceToggle").textContent=voiceEnabled?"🔊 読み上げ ON":"🔇 読み上げ OFF";
 $("#voiceToggle").setAttribute("aria-pressed",String(voiceEnabled));
 if(!voiceEnabled){window.speechSynthesis.cancel();return;}
 speakCurrent(SCENARIOS[state.scenario].turns[state.index]);
});
render();</script></body></html>
